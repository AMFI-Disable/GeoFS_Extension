  <text x="24" y="210" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#64748b">WING &amp; CENTER TANKS</text>
  <rect x="24" y="218" width="70" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
