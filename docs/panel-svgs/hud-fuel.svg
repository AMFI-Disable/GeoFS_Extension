    <line x1="22" y1="50" x2="252" y2="50" stroke="#e2e8f0" stroke-width="1"/>
    
  <text x="24" y="66" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#0f172a">FUEL &amp; WEIGHT</text>
