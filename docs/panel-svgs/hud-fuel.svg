<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="274" height="344" viewBox="0 0 274 344" role="img">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  
    <g filter="url(#shadow)">
      <rect x="12" y="12" width="250" height="320" rx="15" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/>
    </g>
    <!-- Drag grip -->
    <g fill="#94a3b8">
      <circle cx="23" cy="28" r="1.2"/><circle cx="27" cy="28" r="1.2"/>
      <circle cx="23" cy="32" r="1.2"/><circle cx="27" cy="32" r="1.2"/>
      <circle cx="23" cy="36" r="1.2"/><circle cx="27" cy="36" r="1.2"/>
    </g>
    <rect x="34" y="22" width="44" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="56" y="35.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#475569">INFO</text>
<rect x="81" y="22" width="44" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="103" y="35.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#475569">CHECKS</text>
<rect x="128" y="22" width="44" height="20" rx="10" fill="#0d5f8d" stroke="#0d5f8d" stroke-width="1"/>
      <text x="150" y="35.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">FUEL</text>
<rect x="175" y="22" width="44" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="197" y="35.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#475569">LAND</text>
