  <text x="136" y="244" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#0f172a">2,520 kg</text>
  <rect x="178" y="218" width="70" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="213" y="231" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" fill="#64748b">RIGHT</text>
  <text x="213" y="244" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#0f172a">8,100 kg</text>
  <!-- Option pills -->
  <rect x="24" y="266" width="108" height="22" rx="5" fill="#e0f2fe" stroke="#0d5f8d"/>
  <text x="78" y="280" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#0d5f8d">ALTITUDE BURN</text>
  <rect x="140" y="266" width="108" height="22" rx="5" fill="#e0f2fe" stroke="#0d5f8d"/>
  <text x="194" y="280" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#0d5f8d">REAL TANKS</text>
  <rect x="24" y="294" width="108" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="78" y="308" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#475569">AUTO-REFUEL</text>
  <rect x="140" y="294" width="108" height="22" rx="5" fill="#0d5f8d"/>
  <text x="194" y="308" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#ffffff">REFUEL 100%</text>
  
    
</svg>
