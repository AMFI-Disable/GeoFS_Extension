  <text x="59" y="244" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#0f172a">8,100 kg</text>
  <rect x="101" y="218" width="70" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
