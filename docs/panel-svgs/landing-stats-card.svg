  <text x="28" y="128" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">V/S</text>
      <text x="28" y="145" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">-48 fpm</text>
<text x="140" y="128" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">G-FORCE</text>
      <text x="140" y="145" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">1.08 G</text>
<text x="252" y="128" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">GROUND SPD</text>
      <text x="252" y="145" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">131 kt</text>
<text x="28" y="170" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">ROLL</text>
