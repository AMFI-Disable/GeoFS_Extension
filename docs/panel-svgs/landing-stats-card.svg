<text x="140" y="170" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">PITCH</text>
      <text x="140" y="187" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">+4.2°</text>
<text x="252" y="170" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">BOUNCES</text>
      <text x="252" y="187" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">0</text>
  <rect x="28" y="206" width="328" height="30" rx="8" fill="rgba(255,255,255,0.06)"/>
