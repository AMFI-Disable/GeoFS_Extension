<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="264" viewBox="0 0 384 264" role="img">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  
  <g filter="url(#shadow)">
    <rect x="12" y="12" width="360" height="240" rx="15" fill="rgba(0,0,0,0.88)" stroke="#888888" stroke-width="1"/>
  </g>
  <!-- 64x64 Score Badge -->
  <rect x="28" y="28" width="64" height="64" rx="12" fill="rgba(34,197,94,0.18)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="60" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" font-weight="800" fill="#4ade80">9.6</text>
  <text x="60" y="78" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#86efac">OUT OF 10</text>
  <text x="106" y="48" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#4ade80">BUTTER LANDING</text>
  <text x="106" y="68" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#fbbf24">★★★★★</text>
  <rect x="196" y="55" width="70" height="17" rx="8.5" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="231" y="66.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#86efac">AUTHENTIC</text>
  <text x="106" y="88" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Airbus A321neo · KSFO 28R</text>
  <line x1="28" y1="106" x2="356" y2="106" stroke="rgba(148,163,184,0.25)"/>
