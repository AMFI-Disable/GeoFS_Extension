<rect x="128" y="22" width="44" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="150" y="35.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#475569">FUEL</text>
<rect x="175" y="22" width="44" height="20" rx="10" fill="#0d5f8d" stroke="#0d5f8d" stroke-width="1"/>
