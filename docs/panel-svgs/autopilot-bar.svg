<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="64" viewBox="0 0 620 64" role="img">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="620" height="64" fill="#0f172a" rx="12"/>
  
  <rect x="10" y="10" width="600" height="44" rx="22" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <!-- Native AUTOPILOT -->
  <rect x="24" y="18" width="92" height="28" rx="14" fill="#000000" stroke="#888888" stroke-width="1"/>
  <text x="70" y="36" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">AUTOPILOT</text>
  <!-- A/THR Active -->
  <rect x="126" y="18" width="66" height="28" rx="14" fill="#000000" stroke="#4caf50" stroke-width="1.5" filter="url(#glowGreen)"/>
  <text x="159" y="36" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#4ade80">A/THR</text>
  <!-- Speed LCD + Mode -->
  <rect x="200" y="18" width="84" height="28" rx="6" fill="#020617" stroke="#475569"/>
  <text x="230" y="36" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#4ade80">250</text>
  <text x="266" y="35" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8">KTS</text>
  <!-- LANDING ARM -->
  <rect x="292" y="18" width="82" height="28" rx="14" fill="#000000" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="333" y="36" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#fbbf24">LANDING</text>
  <!-- AP++ BETA -->
  <rect x="384" y="18" width="116" height="28" rx="14" fill="#000000" stroke="#4caf50" stroke-width="1.5"/>
  <text x="424" y="30" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">AP++</text>
  <rect x="444" y="21" width="32" height="10" rx="3" fill="rgba(245,158,11,0.28)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="460" y="28.5" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="6.5" font-weight="700" fill="#fbbf24">BETA</text>
  <text x="442" y="41" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="7.5" fill="#4ade80">VNAV · LNAV</text>
  <!-- OP ENG -->
  <rect x="510" y="18" width="84" height="28" rx="14" fill="#000000" stroke="#888888" stroke-width="1"/>
  <text x="552" y="36" text-anchor="middle" font-family="Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">OP ENG</text>
  
</svg>
